plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.remoteccnotify'
version = '0.1.0'

android {
  namespace "expo.modules.remoteccnotify"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 常驻服务用 OkHttp 连后端 /api/events 的 WebSocket。
  // RN 自己也传递依赖 OkHttp,这里显式声明只为编译期能解析到符号。
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
