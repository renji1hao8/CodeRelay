name: Prepare release assets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: node scripts/guard-release.mjs
      - run: npx --yes --registry=https://registry.npmjs.org pnpm@12.11.2 install --frozen-lockfile
      - run: npm --prefix mobile ci
      - run: npm test
      - run: node server/node_modules/typescript/bin/tsc --noEmit -p server/tsconfig.json
      - run: npm --prefix mobile run typecheck
      - run: npm run audit:public
      - run: npm --prefix mobile audit --registry=https://registry.npmjs.org --audit-level=low
      - run: npx --yes --registry=https://registry.npmjs.org pnpm@12.11.2 audit --registry=https://registry.npmjs.org --audit-level=low
      - name: Prepare stable signing
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE) { throw 'Configure stable Android signing Secrets first' }
          $keyPath=Join-Path $env:RUNNER_TEMP 'remotecc-release.jks'
          [IO.File]::WriteAllBytes($keyPath,[Convert]::FromBase64String($env:KEYSTORE))
          "REMOTE_CC_KEYSTORE=$keyPath" >> $env:GITHUB_ENV
      - name: Build Android
        shell: pwsh
        env:
          REMOTE_CC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          REMOTE_CC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REMOTE_CC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-ascii.ps1 -PublicRelease -SkipVersionBump -StageBase "$env:RUNNER_TEMP"
      - run: node scripts/package-windows.mjs
      - run: node scripts/assemble-release.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: CodeRelay-1.0.1
          path: |
            dist/coderelay-1.0.1/*.zip
            dist/coderelay-1.0.1/*.apk
            dist/coderelay-1.0.1/*-Notices.txt
            dist/coderelay-1.0.1/SHA256SUMS.txt
          if-no-files-found: error
